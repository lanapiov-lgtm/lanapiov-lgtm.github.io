<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --oat: #F2EDE4; --warm-white: #FEF9F5; --rose: #C97B8A; --mauve: #D4A5B5;
    --charcoal: #2C2426; --muted: #8C7B7F; --border: #DDD5CC;
    --chem-bg: #FAE8E0; --chem-text: #A0513A;
    --bio-bg: #E4EDE0; --bio-text: #4A7A3A;
    --maths-bg: #EAE0F0; --maths-text: #6A4A8A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--oat); color: var(--charcoal); min-height: 100vh; padding: 24px 16px 60px; }
  .max-w { max-width: 780px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(1.8rem,5vw,2.6rem); letter-spacing: -.02em; line-height: 1.1; }
  header p { font-size: .875rem; color: var(--muted); margin-top: 6px; font-weight: 300; }
  .tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 28px; background: var(--warm-white); border: 1.5px solid var(--border); border-radius: 50px; padding: 4px; width: fit-content; margin-left: auto; margin-right: auto; }
  .tab-btn { padding: 10px 24px; border: none; border-radius: 50px; font-family: 'DM Sans', sans-serif; font-size: .875rem; font-weight: 500; cursor: pointer; background: transparent; color: var(--muted); transition: all .2s; }
  .tab-btn.active { background: var(--rose); color: white; box-shadow: 0 2px 8px rgba(201,123,138,.3); }
  .week-card { background: var(--warm-white); border: 1.5px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .lp-card { background: var(--warm-white); border: 1.5px dashed var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; opacity: .85; }
  .week-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; }
  .week-dates { font-size: .8rem; color: var(--muted); margin-top: 2px; margin-bottom: 12px; }
  .deadline-banner { background: #FEF3CD; border: 1.5px solid #E8C56A; border-radius: 8px; padding: 8px 14px; font-size: .8rem; color: #7A5C00; font-weight: 500; margin-bottom: 16px; }
  .progress-label { font-size: .75rem; color: var(--muted); margin-bottom: 6px; text-align: right; }
  .progress-wrap { background: var(--border); border-radius: 100px; height: 7px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--rose), var(--mauve)); transition: width .4s; }
  .topic-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .topic-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; transition: background .15s; }
  .topic-item:hover { background: var(--oat); }
  .topic-item input[type="checkbox"] { appearance: none; width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 5px; flex-shrink: 0; cursor: pointer; transition: all .15s; position: relative; }
  .topic-item input[type="checkbox"]:checked { background: var(--rose); border-color: var(--rose); }
  .topic-item input[type="checkbox"]:checked::after { content:''; position: absolute; top: 2px; left: 5px; width: 5px; height: 9px; border: 2px solid white; border-top: none; border-left: none; transform: rotate(45deg); }
  .topic-label { font-size: .875rem; color: var(--charcoal); flex: 1; cursor: pointer; transition: all .2s; }
  .topic-item.done .topic-label { text-decoration: line-through; color: var(--muted); }
  .badge { font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 100px; flex-shrink: 0; }
  .badge-chem { background: var(--chem-bg); color: var(--chem-text); }
  .badge-bio { background: var(--bio-bg); color: var(--bio-text); }
  .badge-maths { background: var(--maths-bg); color: var(--maths-text); }
  .badge-recurring { background: #F5E8EA; color: var(--rose); }
  .badge-flag { background: #FFF0E0; color: #B06020; }
  .move-btn { background: none; border: 1.5px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: .7rem; color: var(--muted); cursor: pointer; flex-shrink: 0; transition: all .15s; white-space: nowrap; }
  .move-btn:hover { border-color: var(--rose); color: var(--rose); }
  .del-topic-btn { background: none; border: none; color: var(--border); font-size: 1.1rem; cursor: pointer; flex-shrink: 0; padding: 0 2px; line-height: 1; transition: color .15s; }
  .del-topic-btn:hover { color: var(--rose); }
  .add-area { margin-top: 14px; }
  .add-open-btn { background: none; border: 1.5px dashed var(--border); border-radius: 10px; padding: 8px 16px; font-size: .8rem; color: var(--muted); cursor: pointer; width: 100%; font-family: 'DM Sans', sans-serif; transition: all .15s; }
  .add-open-btn:hover { border-color: var(--rose); color: var(--rose); }
  .add-form { display: none; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .add-form.open { display: flex; }
  .add-form input { flex: 1; min-width: 140px; font-family: 'DM Sans', sans-serif; font-size: .875rem; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--oat); color: var(--charcoal); outline: none; }
  .add-form input:focus { border-color: var(--rose); }
  .add-form select { font-family: 'DM Sans', sans-serif; font-size: .8rem; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--oat); color: var(--charcoal); outline: none; }
  .add-form select:focus { border-color: var(--rose); }
  .add-confirm { background: var(--rose); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: .8rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .add-cancel { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: .8rem; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .section-label { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  /* TRACKER */
  .tracker-form { background: var(--warm-white); border: 1.5px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 28px; }
  .tracker-form h2 { font-family: 'DM Serif Display', serif; font-size: 1.25rem; margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 540px) { .form-grid { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: .75rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .form-group select, .form-group input { font-family: 'DM Sans', sans-serif; font-size: .9rem; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--oat); color: var(--charcoal); outline: none; transition: border-color .2s; }
  .form-group select:focus, .form-group input:focus, textarea:focus { border-color: var(--rose); }
  .questions-group { margin-bottom: 18px; }
  .questions-group label { display: block; font-size: .75rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--charcoal); margin-bottom: 4px; }
  .sublabel { font-size: .8rem; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; display: block; margin-bottom: 8px; }
  textarea { font-family: 'DM Sans', sans-serif; font-size: .9rem; padding: 12px 14px; border: 1.5px solid var(--rose); border-radius: 10px; background: var(--oat); color: var(--charcoal); width: 100%; min-height: 110px; resize: vertical; outline: none; line-height: 1.6; }
  .submit-btn { background: var(--rose); color: white; font-family: 'DM Sans', sans-serif; font-size: .9rem; font-weight: 600; padding: 12px 28px; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 2px 10px rgba(201,123,138,.3); transition: background .2s; }
  .submit-btn:hover { background: #b86778; }
  .entries-section h2 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; margin-bottom: 16px; }
  .entry-card { background: var(--warm-white); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .entry-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .entry-score { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--rose); }
  .entry-ql { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--charcoal); margin-bottom: 6px; }
  .entry-q { font-size: .875rem; line-height: 1.7; background: var(--oat); padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--rose); white-space: pre-wrap; }
  .delete-btn { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 12px; font-size: .75rem; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .15s; }
  .delete-btn:hover { border-color: var(--rose); color: var(--rose); }
  .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: .875rem; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>
<div class="max-w">
  <header>
    <h1>Revision Planner</h1>
    <p>11 May – 14 June 2025 · Chemistry, Biology, Maths</p>
  </header>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('plan',this)">Revision Plan</button>
    <button class="tab-btn" onclick="switchTab('tracker',this)">Past Paper Tracker</button>
  </div>
  <div id="tab-plan" class="tab-content active"></div>
  <div id="tab-tracker" class="tab-content">
    <div class="tracker-form">
      <h2>Log a Past Paper</h2>
      <div class="form-grid">
        <div class="form-group"><label>Subject</label><select id="f-subject"><option value="">Select…</option><option>Chemistry</option><option>Biology</option><option>Maths</option></select></div>
        <div class="form-group"><label>Year</label><input type="text" id="f-year" placeholder="e.g. 2023"></div>
        <div class="form-group"><label>Score / %</label><input type="number" id="f-score" placeholder="e.g. 72" min="0" max="100"></div>
      </div>
      <div class="questions-group">
        <label>Questions Got Wrong <span class="sublabel">List the questions, topics, or specific mistakes</span></label>
        <textarea id="f-questions" placeholder="e.g. Q3b — confused Le Chatelier&#10;Q7 — forgot Born-Haber cycle"></textarea>
      </div>
      <button class="submit-btn" onclick="addEntry()">+ Add Entry</button>
    </div>
    <div class="entries-section"><h2>Your Entries</h2><div id="entries-list"></div></div>
  </div>
</div>
<script>
const DEFAULT_WEEKS = [
  {id:'w1',title:'Week 1',dates:'11 May – 17 May',deadline:'Due 15 May — Chemical Equilibria, Redox, Alkanes, Halogenoalkanes, Alkenes',topics:[
    {l:'Amount of Substance',b:'recurring'},{l:'Bonding',b:'recurring'},{l:'Organic Analysis',b:'flag'},
    {l:'Chemical Equilibria & Le Chatelier\'s Principle',b:'chem'},{l:'Oxidation Reduction & Redox Equations',b:'chem'},
    {l:'Alkanes',b:'chem'},{l:'Halogenoalkanes',b:'chem'},{l:'Alkenes',b:'chem'},
    {l:'Proteins — general properties & enzymes',b:'bio'},{l:'Carbohydrates',b:'bio'},{l:'Past paper: Chemistry',b:'chem'}]},
  {id:'w2',title:'Week 2',dates:'18 May – 24 May',deadline:'Due 22 May — Alcohols',topics:[
    {l:'Amount of Substance',b:'recurring'},{l:'Bonding',b:'recurring'},{l:'Alcohols',b:'chem'},
    {l:'Nucleic acids — DNA replication',b:'bio'},{l:'DNA & protein synthesis',b:'bio'},
    {l:'Transport across cell membranes',b:'bio'},{l:'Cell recognition & the immune system',b:'bio'},
    {l:'Ch 12 — Differentiation',b:'maths'},{l:'Past paper: Biology',b:'bio'}]},
  {id:'w3',title:'Week 3',dates:'25 May – 31 May',deadline:null,topics:[
    {l:'Amount of Substance',b:'recurring'},{l:'Bonding',b:'recurring'},{l:'Energetics',b:'chem'},{l:'Kinetics',b:'chem'},
    {l:'Genetic diversity — mutation & meiosis',b:'bio'},{l:'DNA genes & chromosomes',b:'bio'},{l:'Gas exchange',b:'bio'},
    {l:'Ch 14 — Exponentials & Logarithms',b:'maths'},{l:'Stats Ch 5 — Probability',b:'maths'},{l:'Past paper: Maths Pure',b:'maths'}]},
  {id:'w4',title:'Week 4',dates:'1 June – 7 June',deadline:null,topics:[
    {l:'Amount of Substance',b:'recurring'},{l:'Bonding',b:'recurring'},{l:'Mass transport in animals',b:'bio'},
    {l:'Mass transport in plants',b:'bio'},{l:'Genetic diversity & adaptation',b:'bio'},{l:'Digestion & absorption',b:'bio'},
    {l:'Stats Ch 6 — Statistical Distributions',b:'maths'},{l:'Stats Ch 7 — Hypothesis Testing',b:'maths'},
    {l:'Mechanics Ch 9 — Constant Acceleration',b:'maths'},{l:'Mechanics Ch 10 — Forces & Motion',b:'maths'},
    {l:'Past paper: Chemistry (second)',b:'chem'},{l:'Past paper: Maths Stats & Mechanics',b:'maths'}]},
  {id:'w5',title:'Week 5',dates:'8 June – 14 June',deadline:null,topics:[
    {l:'Amount of Substance',b:'recurring'},{l:'Bonding',b:'recurring'},
    {l:'Past paper: Biology (second)',b:'bio'},{l:'Past paper: Chemistry (third)',b:'chem'},{l:'Past paper: Maths full paper',b:'maths'},
    {l:'Chemistry flashcard run-through',b:'chem'},{l:'Biology flashcard run-through',b:'bio'},
    {l:'Maths formula sheet run-through',b:'maths'},{l:'Nucleic acids — structure of DNA & RNA',b:'bio'},{l:'Lipids — quick review',b:'bio'}]},
];
const DEFAULT_LP = [
  {l:'Cells — eukaryotic cell structure',b:'bio'},{l:'Cells — prokaryotic cells & viruses',b:'bio'},
  {l:'Cells — methods of studying cells',b:'bio'},{l:'All cells arise from other cells',b:'bio'},
  {l:'ATP',b:'bio'},{l:'Water',b:'bio'},{l:'Inorganic ions',b:'bio'},{l:'Species & taxonomy',b:'bio'},
  {l:'Biodiversity within a community',b:'bio'},{l:'Investigating diversity',b:'bio'},
  {l:'Ch 6 — Circles',b:'maths'},{l:'Ch 11 — Vectors',b:'maths'},{l:'Stats Ch 1 — Data Collection',b:'maths'},
  {l:'Stats Ch 2 — Measures of Location & Spread',b:'maths'},{l:'Stats Ch 3 — Representations of Data',b:'maths'},
  {l:'Stats Ch 4 — Correlation',b:'maths'},{l:'Mechanics Ch 8 — Modelling in Mechanics',b:'maths'},
  {l:'Mechanics Ch 11 — Variable Acceleration',b:'maths'},
];
const BADGES = {
  chem:{cls:'badge-chem',lbl:'Chem'}, bio:{cls:'badge-bio',lbl:'Bio'}, maths:{cls:'badge-maths',lbl:'Maths'},
  recurring:{cls:'badge-recurring',lbl:'↻ recurring'}, flag:{cls:'badge-flag',lbl:'⚑ test this week'}
};

function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(d));}catch{return JSON.parse(JSON.stringify(d));}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let weeks = ls('rp2-weeks', DEFAULT_WEEKS);
let lp    = ls('rp2-lp', DEFAULT_LP);
let chks  = ls('rp2-chks', {});

function saveAll(){ ss('rp2-weeks',weeks); ss('rp2-lp',lp); ss('rp2-chks',chks); }

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  let h='';
  weeks.forEach((w,wi)=>{
    const nextTitle = wi<weeks.length-1 ? weeks[wi+1].title : 'Lower Priority';
    h+=weekHTML(w,wi,nextTitle);
  });
  h+=lpHTML();
  document.getElementById('tab-plan').innerHTML=h;
}

function weekHTML(w,wi,nextTitle){
  const {done,total,pct}=prog(w.id,w.topics);
  return `<div class="week-card">
    <div class="week-title">${esc(w.title)}</div>
    <div class="week-dates">${esc(w.dates)}</div>
    ${w.deadline?`<div class="deadline-banner">⚠️ ${esc(w.deadline)}</div>`:''}
    <div class="progress-label">${done} / ${total} complete</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <ul class="topic-list">
      ${w.topics.map((t,i)=>topicRow(t,i,w.id,nextTitle)).join('')}
    </ul>
    ${addArea(w.id)}
  </div>`;
}

function lpHTML(){
  const {done,total,pct}=prog('lp',lp);
  return `<div class="lp-card">
    <div class="section-label">Lower Priority</div>
    <div class="week-title" style="font-family:'DM Serif Display',serif;font-size:1rem;color:var(--muted);margin-bottom:4px">If time allows</div>
    <div class="week-dates">Fit in where possible</div>
    <div class="progress-label">${done} / ${total} complete</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <ul class="topic-list">
      ${lp.map((t,i)=>topicRow(t,i,'lp',null)).join('')}
    </ul>
    ${addArea('lp')}
  </div>`;
}

function topicRow(t,i,wid,nextTitle){
  const b=BADGES[t.b]||BADGES.chem;
  const checked=chks[wid+'-'+i];
  const doneClass=checked?'done':'';
  const moveBtn=nextTitle
    ?`<button class="move-btn" onclick="moveTopic('${wid}',${i})">→ ${esc(nextTitle)}</button>`
    :'';
  return `<li class="topic-item ${doneClass}">
    <input type="checkbox" ${checked?'checked':''} onchange="toggleChk('${wid}',${i},this)">
    <span class="topic-label" onclick="toggleChkLabel('${wid}',${i})">${esc(t.l)}</span>
    <span class="badge ${b.cls}">${b.lbl}</span>
    ${moveBtn}
    <button class="del-topic-btn" onclick="delTopic('${wid}',${i})" title="Remove">×</button>
  </li>`;
}

function addArea(wid){
  return `<div class="add-area">
    <button class="add-open-btn" onclick="openAdd('${wid}')">+ Add topic</button>
    <div class="add-form" id="af-${wid}">
      <input type="text" id="ai-${wid}" placeholder="Topic name…" onkeydown="if(event.key==='Enter')confirmAdd('${wid}')">
      <select id="ab-${wid}"><option value="chem">Chem</option><option value="bio">Bio</option><option value="maths">Maths</option></select>
      <button class="add-confirm" onclick="confirmAdd('${wid}')">Add</button>
      <button class="add-cancel" onclick="cancelAdd('${wid}')">Cancel</button>
    </div>
  </div>`;
}

function prog(wid,topics){
  const done=topics.filter((_,i)=>chks[wid+'-'+i]).length;
  const total=topics.length;
  return {done,total,pct:total?Math.round(done/total*100):0};
}

// ── INTERACTIONS ──────────────────────────────────────────────
function switchTab(tab,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}

function toggleChk(wid,i,cb){
  chks[wid+'-'+i]=cb.checked;
  saveAll(); render();
}

function toggleChkLabel(wid,i){
  chks[wid+'-'+i]=!chks[wid+'-'+i];
  saveAll(); render();
}

function moveTopic(wid,i){
  const fromTopics = wid==='lp'?lp:weeks.find(w=>w.id===wid).topics;
  const topic=fromTopics[i];

  // Build new checks for source week after removal
  const newFromChks={};
  fromTopics.forEach((_,idx)=>{
    if(idx<i) newFromChks[wid+'-'+idx]=!!chks[wid+'-'+idx];
    else if(idx>i) newFromChks[wid+'-'+(idx-1)]=!!chks[wid+'-'+idx];
  });
  Object.keys(chks).filter(k=>k.startsWith(wid+'-')).forEach(k=>delete chks[k]);
  Object.assign(chks,newFromChks);

  fromTopics.splice(i,1);

  // Add to destination
  let toWid, toTopics;
  if(wid==='lp'){
    // nothing after lp
    saveAll(); render(); return;
  }
  const wi=weeks.findIndex(w=>w.id===wid);
  if(wi===weeks.length-1){ toWid='lp'; toTopics=lp; }
  else { toWid=weeks[wi+1].id; toTopics=weeks[wi+1].topics; }

  chks[toWid+'-'+toTopics.length]=false;
  toTopics.push(topic);

  saveAll(); render();
}

function delTopic(wid,i){
  const topics=wid==='lp'?lp:weeks.find(w=>w.id===wid).topics;
  // Rebuild checks
  const newChks={};
  topics.forEach((_,idx)=>{
    if(idx<i) newChks[wid+'-'+idx]=!!chks[wid+'-'+idx];
    else if(idx>i) newChks[wid+'-'+(idx-1)]=!!chks[wid+'-'+idx];
  });
  Object.keys(chks).filter(k=>k.startsWith(wid+'-')).forEach(k=>delete chks[k]);
  Object.assign(chks,newChks);
  topics.splice(i,1);
  saveAll(); render();
}

function openAdd(wid){
  document.getElementById('af-'+wid).classList.add('open');
  document.getElementById('ai-'+wid).focus();
}
function cancelAdd(wid){
  document.getElementById('af-'+wid).classList.remove('open');
  document.getElementById('ai-'+wid).value='';
}
function confirmAdd(wid){
  const inp=document.getElementById('ai-'+wid);
  const badge=document.getElementById('ab-'+wid).value;
  const label=inp.value.trim();
  if(!label) return;
  const topics=wid==='lp'?lp:weeks.find(w=>w.id===wid).topics;
  topics.push({l:label,b:badge});
  chks[wid+'-'+(topics.length-1)]=false;
  saveAll(); render();
}

// ── TRACKER ───────────────────────────────────────────────────
function addEntry(){
  const subject=document.getElementById('f-subject').value;
  const year=document.getElementById('f-year').value.trim();
  const score=document.getElementById('f-score').value;
  const questions=document.getElementById('f-questions').value.trim();
  if(!subject||!year||!score||!questions){alert('Please fill in all fields.');return;}
  const entries=getEntries();
  entries.unshift({subject,year,score:Number(score),questions,ts:Date.now()});
  ss('pp-entries',entries);
  renderEntries();
  document.getElementById('f-subject').value='';
  document.getElementById('f-year').value='';
  document.getElementById('f-score').value='';
  document.getElementById('f-questions').value='';
}
function getEntries(){return ls('pp-entries',[]);}
function deleteEntry(ts){ss('pp-entries',getEntries().filter(e=>e.ts!==ts));renderEntries();}
function renderEntries(){
  const entries=getEntries();
  const el=document.getElementById('entries-list');
  if(!entries.length){el.innerHTML='<div class="empty-state">No entries yet.</div>';return;}
  const sc=s=>s==='Chemistry'?'badge-chem':s==='Biology'?'badge-bio':'badge-maths';
  el.innerHTML=entries.map(e=>`
    <div class="entry-card">
      <div class="entry-header">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="badge ${sc(e.subject)}">${e.subject}</span>
          <span style="font-size:.8rem;color:var(--muted)">${e.year}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="entry-score">${e.score}%</span>
          <button class="delete-btn" onclick="deleteEntry(${e.ts})">Delete</button>
        </div>
      </div>
      <div class="entry-ql">Questions got wrong</div>
      <div class="entry-q">${esc(e.questions)}</div>
    </div>`).join('');
}

render();
renderEntries();
</script>
</body>
</html>
